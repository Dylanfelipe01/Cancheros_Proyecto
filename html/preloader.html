<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cancheros</title>

    <!-- CSS del preloader -->
<link rel="stylesheet" href="../Styles/preloader.css">
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Preloader Cancheros -->
    <div id="preloader" class="preloader">

        <!-- Canvas para las partículas -->
        <canvas id="preloader-canvas"></canvas>

        <div class="preloader-content">

            <h1 class="preloader-title">
                CANCHEROS
            </h1>

            <p class="preloader-subtitle">
                Cargando la cancha...
            </p>

            <!-- Barra de progreso -->
            <div class="preloader-bar-container">

                <div class="preloader-progress"></div>

                <!-- Balón -->
                <div class="preloader-ball">
                    <i class="fa-solid fa-futbol fa-spin"></i>
                </div>

            </div>

            <!-- Instrucciones -->
            <div class="preloader-instructions">
                <p class="instruction-text">
                    Presiona ESPACIO o haz Clic para avanzar
                </p>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
<script src="../preloader.js"></script>
</body>

</html>
