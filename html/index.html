<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancheros</title>
  <link rel="stylesheet" href="preloader.css">
  <!-- CDN Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

  <!-- Preloader Cancheros -->
  <div id="preloader" class="preloader">
    <canvas id="preloader-canvas"></canvas>

    <div class="preloader-content">
      <h1 class="preloader-title">CANCHEROS</h1>
      <p class="preloader-subtitle">Cargando la cancha...</p>

      <!-- Contenedor con barra más grande y balón Font Awesome -->
      <div class="preloader-bar-container">
        <div class="preloader-progress"></div>
        <div class="preloader-ball">
          <i class="fa-solid fa-futbol fa-spin"></i>
        </div>
      </div>

      <!-- Texto de instrucciones -->
      <div class="preloader-instructions">
        <p class="instruction-text">Presiona ESPACIO o haz Clic para avanzar</p>
      </div>
    </div>
  </div>

  <script src="preloader.js"></script>
</body>

</html>
