    <!-- ================= CONTENIDO ================= -->

    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body p-5">

                        <h2 class="text-center mb-3 titulo-contacto">
                            Contáctanos
                        </h2>

                        <p class="text-center text-muted mb-4">
                            ¿Tienes alguna duda o deseas comunicarte con nosotros?
                            Completa el siguiente formulario.
                        </p>

                        <form id="formContacto" action="https://formspree.io/f/mnjeeelw" method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Nombre
                                </label>

                                <input type="text" id="nombre" name="nombre" class="form-control"
                                    placeholder="Ingrese su nombre">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email" id="correo" name="correo" class="form-control"
                                    placeholder="correo@ejemplo.com">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Teléfono
                                </label>

                                <input type="tel" id="telefono" name="telefono" class="form-control"
                                    placeholder="3001234567">

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Mensaje
                                </label>

                                <textarea id="mensaje" name="mensaje" class="form-control" rows="5"
                                    placeholder="Escriba su mensaje"></textarea>

                            </div>

                            <button class="btn btn-success w-100 py-2" type="submit">

                                Enviar mensaje

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>
