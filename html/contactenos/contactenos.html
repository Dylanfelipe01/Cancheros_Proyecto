<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctenos</title>

    <link rel="stylesheet" href="/Styles/contactenos/contactenos.css">
</head>
<body>

<main>

<form
    id="formContacto"
    action="https://formspree.io/f/TU_FORM_ID"
    method="POST"
    class="fs-form"
>

    <div class="fs-field">
        <label for="nombre">Nombre</label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingrese su nombre"
        >
    </div>

    <div class="fs-field">
        <label for="correo">Correo electrónico</label>

        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="correo@ejemplo.com"
        >
    </div>

    <div class="fs-field">
        <label for="telefono">Teléfono</label>

        <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="3001234567"
        >
    </div>

    <div class="fs-field">
        <label for="mensaje">Mensaje</label>

        <textarea
            id="mensaje"
            name="mensaje"
            rows="6"
            placeholder="Escribe tu mensaje..."
        ></textarea>
    </div>

    <button type="submit">
        Enviar
    </button>

</form>

</main>

<script src="./contactenos.js"></script>

</body>
</html>
