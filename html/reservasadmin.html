<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vista de administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../Styles/reservasadmin.css">
</head>
<body>
    <main class="container-fluid py-4">
        <section class="mb-2">

        </section>

<div class="d-flex justify-content-end align-items-center mb-3">
    
    <div class="icono-administrador me-2">
        <i class="bi bi-person-fill"></i>
    </div>

    <span class="fw-semibold">
        Administrador
    </span>

</div>



        <section class="container py-4">


<div class="text-center mb-4">
        <h2 class="fw-bold">Reservas registradas</h2>
        <p class="text-muted mb-0">
            Consulta y administra las reservas de las canchas.
        </p>
       <div class="container mb-4">
    <div class="row g-3 justify-content-center mt-4">

  
        <div class="col-auto">
            <div class="card tarjeta-resumen tarjeta-total">
                <div class="card-body text-center py-3">
                    <i class="bi bi-calendar-check icono-resumen"></i>
                    <h6 class="mt-2 mb-1">Total reservas</h6>
                    <h3 class="fw-bold mb-0">24</h3>
                </div>
            </div>
        </div>

        
        <div class="col-auto">
            <div class="card tarjeta-resumen tarjeta-completadas">
                <div class="card-body text-center py-3">
                    <i class="bi bi-check-circle icono-resumen"></i>
                    <h6 class="mt-2 mb-1">Completadas</h6>
                    <h3 class="fw-bold mb-0">20</h3>
                </div>
            </div>
        </div>

     
       <div class="col-auto">
            <div class="card tarjeta-resumen tarjeta-canceladas">
                <div class="card-body text-center py-3">
                    <i class="bi bi-x-circle icono-resumen"></i>
                    <h6 class="mt-2 mb-1">Canceladas</h6>
                    <h3 class="fw-bold mb-0">4</h3>
                </div>
            </div>
        </div>

    </div>
</div>
   
    <button class="btn btn-agregar-cancha d-inline-flex align-items-center mt-5 mb-2">
        <i class="bi bi-plus-circle me-3"></i>Agregar cancha</button>
</div>

            <div class="table-responsive tabla-contenedor">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Referencia</th>
                            <th>Disponible</th>
                            <th>Descripción</th>
                            <th>Nombre cancha</th>
                            <th>Precio</th>
                            <th>Ubicación</th>
                            <th>Fotos</th>
                        </tr>

    <tr id="sinReservas">  <!--este id permite que javascript encuentre el mensaje y lo elimine-->
        <td colspan="7" class="mensaje-sin-reservas">
            No hay reservas agregadas todavía.
        </td>   <!--sebastian aqui cuando agregues datos, este mensaje desaparece y aparecen los datos ingresados-->
    </tr>
</tbody>
                </table>
            </div>
        </section>
    </main>
